<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: transparent;
            }
            deep-chat {
                display: block;
                height: 100%;
                width: 100%;
            }
        </style>

        <script type="text/javascript" src="js/qwebchannel.js"></script>
        <script type="text/javascript" src="js/deepChat.bundle.js"></script>
        <script type="text/javascript" src="js/chat-bridge.js"></script>
    </head>
    <body>
        <span
            id="token-counter"
            style="
                position: absolute;
                bottom: 8px;
                right: 16px;
                font-size: 11px;
                color: #999;
                z-index: 10;
                pointer-events: none;
            "
        ></span>
        <deep-chat
            style="border-radius: 10px"
            auxiliaryStyle="
                /* --- Markdown Tables (fit within chat, no overflow) --- */
                table {
                    width: 100%;
                    table-layout: fixed;
                    border-collapse: collapse;
                    margin: 1em 0;
                    font-size: 0.88em;
                }
                thead tr th {
                    border-bottom: 1.5px solid #aaa;
                }
                thead th {
                    text-align: center;
                    font-weight: 600;
                    padding: 5px 8px;
                    word-break: break-word;
                    overflow-wrap: anywhere;
                }
                tbody th {
                    text-align: left;
                }
                th, td {
                    padding: 4px 8px;
                    vertical-align: bottom;
                    word-break: break-word;
                    overflow-wrap: anywhere;
                }
                td {
                    text-align: right;
                    padding-bottom: 0.3em;
                }
                tbody tr:last-child th,
                tbody tr:last-child td {
                    border-bottom: 1.5px solid #aaa;
                }
                tbody tr:nth-child(even) td,
                tbody tr:nth-child(even) th {
                    background: rgba(128,128,128,0.08);
                }
                tbody tr:nth-child(odd) td,
                tbody tr:nth-child(odd) th {
                    background: rgba(128,128,128,0.02);
                }
            "
            errorMessages='{"displayServiceErrorMessages": true}'
            messageStyles='{
                "default": {
                    "shared": {
                        "bubble": {
                            "maxWidth": "100%", "backgroundColor": "unset", "marginTop": "10px", "marginBottom": "10px"
                        }
                    },
                    "user": {
                        "bubble": {
                            "marginLeft": "0px", "color": "black"
                        }
                    },
                    "ai": {
                        "outerContainer": {
                            "backgroundColor": "rgba(247,247,248)", "borderTop": "1px solid rgba(0,0,0,.1)", "borderBottom": "1px solid rgba(0,0,0,.1)"
                        }
                    }
                }
            }'
            avatars='{
                "default": {"styles": {"position": "start"}}
            }'
            submitButtonStyles='{
                "submit": {
                    "container": {
                        "default": {"backgroundColor": "#19c37d"},
                        "hover": {"backgroundColor": "#0bab69"},
                        "click": {"backgroundColor": "#068e56"}
                    },
                    "svg": {
                        "content": "<?xml version=\"1.0\" ?> <svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"> <g> <path d=\"M21.66,12a2,2,0,0,1-1.14,1.81L5.87,20.75A2.08,2.08,0,0,1,5,21a2,2,0,0,1-1.82-2.82L5.46,13H11a1,1,0,0,0,0-2H5.46L3.18,5.87A2,2,0,0,1,5.86,3.25h0l14.65,6.94A2,2,0,0,1,21.66,12Z\"> </path> </g> </svg>",
                        "styles": {
                            "default": {
                                "width": "1.3em",
                                "marginTop": "0.15em",
                                "filter": "brightness(0) saturate(100%) invert(100%) sepia(28%) saturate(2%) hue-rotate(69deg) brightness(107%) contrast(100%)"
                            }
                        }
                    }
                },
                "loading": {
                    "container": {"default": {"backgroundColor": "white"}},
                    "svg": {
                        "styles": {
                            "default": {"filter": "brightness(0) saturate(100%) invert(72%) sepia(0%) saturate(3044%) hue-rotate(322deg) brightness(100%) contrast(96%)"}
                        }
                    }
                },
                "stop": {
                    "container": {
                        "default": {"backgroundColor": "white"},
                        "hover": {"backgroundColor": "#dadada52"}
                    },
                    "svg": {
                        "content": "<?xml version=\"1.0\" encoding=\"utf-8\"?> <svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"> <rect width=\"24\" height=\"24\" rx=\"4\" ry=\"4\" /> </svg>",
                        "styles": {
                            "default": {
                                "width": "0.95em",
                                "marginTop": "0.32em",
                                "filter": "brightness(0) saturate(100%) invert(72%) sepia(0%) saturate(3044%) hue-rotate(322deg) brightness(100%) contrast(96%)"
                            }
                        }
                    }
                }
            }'
            textInput='{"placeholder": {"text": "Ask anything..."}}'
            introMessage='{"text": "This is a beta version of JASP AI.\nPlease monitor the costs and always question AI output.\nIntended for personal use. Contact [JASP Services BV](https://www.jasp-services.com/contact/) for enterprise / institutional support."}'
            customButtons='[
    		{
    			"position": "outside-start",
    			"tooltip": {"text": "Clear conversation"},
    			"styles": {
    				"button": {
    					"default": {
    						"container": {
    							"default": {
    								"backgroundColor": "transparent",
    								"border": "none",
    								"width": "2em",
    								"height": "2em",
    								"display": "flex",
    								"justifyContent": "center",
    								"alignItems": "center"
    							},
    							"hover": {
    								"backgroundColor": "#f0f0f0",
    								"borderRadius": "4px"
    							}
    						},
    						"svg": {
    							"content": "<?xml version=\"1.0\" encoding=\"utf-8\"?><svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3\" stroke=\"#888\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
    							"styles": {
    								"default": {
    									"width": "2em",
    									"height": "2em",
    									"filter": "brightness(0) saturate(100%)"
    								}
    							}
    						}
    					}
    				}
    			}
		}
	]'
        ></deep-chat>
    </body>
</html>
