<!doctype html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<pre id="log" style="color:white;background:#222;padding:10px;font:12px monospace;"></pre>
<script src="js/qwebchannel.js"></script>
<script>
var out = document.getElementById('log');
function L(m) { out.textContent += m + '\n'; }

L('page loaded');
L('typeof qt = ' + typeof qt);

if (typeof qt !== 'undefined') {
    L('qt.webChannelTransport = ' + typeof qt.webChannelTransport);
    if (qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function(ch) {
            L('objects: ' + Object.keys(ch.objects).join(', '));
            var a = ch.objects.aiBridge;
            if (a) L('aiBridge found!');
            else L('aiBridge NOT FOUND. objects: ' + JSON.stringify(Object.keys(ch.objects)));
        });
    } else {
        L('TRANSPORT MISSING');
    }
} else {
    L('qt UNDEFINED');
}
</script>
</body>
</html>
