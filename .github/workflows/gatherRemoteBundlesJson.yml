name: Gather JSON core Bundles

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout jasp-desktop
        uses: actions/checkout@v5
        with:
          path:  'jasp-desktop'

      - name: Checkout secondary repo
        uses: actions/checkout@v5
        with:
          repository: jasp-stats-modules/modules-registry
          path:  'modules-registry'
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub
          pip install argparse

      - name: Run script
        run: python3 jasp-desktop/Tools/gatherModuleJson.py --prerelease modules-registry/core-modules/ ${{ secrets.GITHUB_TOKEN }} > jasp-desktop/Modules/remote-bundles.json 

      - name: commit and push
        run: |
          cd jasp-desktop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Modules/remote-bundles.json
          git commit -m "Update Bundles" || echo "nothing to commit!"
          git push
